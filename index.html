<!-- HTML document for displaying the Sierpinski Gasket using WebGL -->
<!-- Define the HTML5 document type and specify the document language -->
<!DOCTYPE html>
<html lang="en">

<!-- Define the metadata such as the character set and viewport settings -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Set title for the webpage -->
    <title>Display the Sierpinski Gasket</title>
</head>

<!-- Define the body containing the WebGL canvas and JavaScript required to render the WebGL -->
<body>
    <!-- Create a canvas element for WebGL rendering defining its width and height -->
    <canvas id="glCanvas" width="500" height="500" ></canvas>

    <!-- Include the external JavaScript file containing the WebGL code -->
    <script src="webgl-demo.js"></script>

</body>

</html>
